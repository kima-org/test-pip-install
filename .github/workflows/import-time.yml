name: test import time

on:
  workflow_dispatch:
  schedule:
    - cron: "5 5 * * 1,3,5"

jobs:
  build:

    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.15"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install benchmark-imports
  
    - name: Install kima
      run: |
        #python -m pip install --extra-index-url https://test.pypi.org/simple  kima
        python -m pip install kima

    - name: Test import
      run: |
        python -c "import kima"

    - name: Measure import time
      run : |
        python -m benchmark_imports kima

    - name: Run 51Peg example
      run : |
        python -c "from kima import examples; examples._51Peg(run=True, load=True, steps=100)"
